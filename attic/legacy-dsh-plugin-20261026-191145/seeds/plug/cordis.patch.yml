# 副驾（plug）profile 的用户补丁层 —— 只放喵系插件的配置，别放第三方实验包。
# 这份文件坏了，副驾起不来，但主 harness（E:\DSH\home\profiles\desktop）一根毛都不会动。
- id: meow-memory
  name: "meow-memory"
  config:
    promptLang: "zh"
    # 记忆库目录与主 harness 分开：副驾写在 <工作区>\.dsh-meow-plug，
    # 主实例的 .dsh-meow（junction → E:\DSH\home\storages\meow-shared）不碰。
    projectDir: ".dsh-meow-plug"
    # 全局数据目录（window-index / perf.log / prompts 覆盖）也指向副驾自己的 home。
    homeDir: "dsh-storage"
    dream:
      # 副驾里默认不自动整理记忆：省 token，也避免和主实例的 dream 打架。
      enabled: false
    backup:
      enabled: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max
