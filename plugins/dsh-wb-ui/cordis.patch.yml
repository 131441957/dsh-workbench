# workbench bundle patch: webui injection (tapIndex) + 精简界面
- insert:
    - id: wb-ui
      name: 'dsh-wb-ui'
# ⚠️ 不要禁用 ui-workspace / ui-conversation 这类**提供服务**的行：
#    ui-workspace 提供 uiWorkspace，一关会让 conversation/chat/sidebar 等 11 项 pending，
#    浏览器直接报 "11 entries did not activate"。
#    要「看不见」这些界面，用 ui/workbench.js 按文字隐藏（不动插件）。
- id: ui-schedule
  disabled: true
- id: ui-plugin-manager
  disabled: true
# 预览版说明的已读版本（volatile 字段，只能放包补丁；用户补丁层会被应用重写抹掉）
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: "2026-09-28.1"
